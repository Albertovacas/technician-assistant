[project]
name = "pool-assistant"
version = "0.1.0"
description = "Multi-agent GenAI assistant that answers pool technicians' questions from Fluidra product manuals."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fast-langdetect>=1.0",
    "fastembed>=0.6",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=0.6",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "qdrant-client>=1.12",
]

[project.scripts]
pool-assistant = "pool_assistant.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "pytest>=8.3",
    "ruff>=0.8",
]
notebooks = [
    "grandalf>=0.8",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
]

[tool.uv]
# `uv sync` installs these groups by default (Docker image will use `--no-default-groups`).
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pool_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: loads real ML models (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
